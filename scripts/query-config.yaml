sources:
  ais_data_v1:
    description: "AIS vessel tracking data"
    csv_path: "../../data/ais.csv"
    csv_delimiter: ","
    scale_factor: 1.0
    id_field: "MMSI"
    timestamp_field: "# Timestamp"
    timestamp_format: "02/01/2006 15:04:05"
    lat_field: "Latitude"
    lon_field: "Longitude"
    columns:
      MMSI:               { from_field: "MMSI",                type: VARCHAR }
      Name:               { from_field: "Name",                type: VARCHAR }
      Latitude:           { from_field: "Latitude",            type: DOUBLE,  required: true }
      Longitude:          { from_field: "Longitude",           type: DOUBLE,  required: true }
      SOG:                { from_field: "SOG",                 type: DOUBLE }
      Timestamp:          { from_field: "# Timestamp",         type: VARCHAR }
      NavigationalStatus: { from_field: "Navigational status", type: VARCHAR }
    reference_tables:
      towers:
        columns:
          tower_name:   VARCHAR
          geom_wkt:     VARCHAR
          threshold_nm: DOUBLE
        rows:
          - tower_name:   "Tower Alpha"
            geom_wkt:     "POINT(10.2 57.1)"
            threshold_nm: 5.0
          - tower_name:   "Tower Beta"
            geom_wkt:     "POINT(7.8 55.7)"
            threshold_nm: 5.0
          - tower_name:   "Tower Gamma"
            geom_wkt:     "POINT(10.7 58.2)"
            threshold_nm: 5.0
queries:
  - name: vessels_near_towers
    data_source: ais_data_v1
    window_type: tumbling
    window_size: 60
    query: >
      SELECT COUNT(DISTINCT mmsi) as vessel_count FROM events
    return_type: spatial
    is_alert: true
    alert_format: "VESSEL {mmsi} ({name}) passed within {distance_nm} nm of {tower_name} | sog={sog} kn | ts={timestamp}"
