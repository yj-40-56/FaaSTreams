sources:
  ais_data_v1:
    description: "AIS vessel tracking data"
    id_field: "MMSI"
    timestamp_field: "# Timestamp"
    timestamp_format: "02/01/2006 15:04:05"
    lat_field: "Latitude"
    lon_field: "Longitude"
    columns:
      MMSI:               { from_field: "MMSI",                type: VARCHAR }
      Name:               { from_field: "Name",                type: VARCHAR }
      Latitude:           { from_field: "Latitude",            type: DOUBLE,  required: true }
      Longitude:          { from_field: "Longitude",           type: DOUBLE,  required: true }
      SOG:                { from_field: "SOG",                 type: DOUBLE }
      Timestamp:          { from_field: "# Timestamp",         type: VARCHAR }
      NavigationalStatus: { from_field: "Navigational status", type: VARCHAR }
    reference_tables:
      zones:
        columns:
          zone_name:    VARCHAR
          geom_wkt:     VARCHAR
          threshold_nm: DOUBLE
        rows:
          - zone_name:    "Subsea Pipeline Corridor Kattegat"
            geom_wkt:     "POLYGON((10.0 57.0, 10.5 57.0, 10.5 57.5, 10.0 57.5, 10.0 57.0))"
            threshold_nm: 2.0
          - zone_name:    "Offshore Wind Exclusion North Sea"
            geom_wkt:     "POLYGON((7.5 55.5, 8.0 55.5, 8.0 56.0, 7.5 56.0, 7.5 55.5))"
            threshold_nm: 2.0
          - zone_name:    "Restricted Zone Skagerrak"
            geom_wkt:     "POLYGON((10.5 58.0, 11.0 58.0, 11.0 58.5, 10.5 58.5, 10.5 58.0))"
            threshold_nm: 2.0
          - zone_name:    "Military Exercise Area Bornholm"
            geom_wkt:     "POLYGON((15.5 55.5, 16.0 55.5, 16.0 56.0, 15.5 56.0, 15.5 55.5))"
            threshold_nm: 3.0

    t-drive_data_v1:
      description: "T-Drive dataset: taxis in Beijing"
      id_field: "taxi_id"
      timestamp_field: "timestamp"
      timestamp_format: "2006-01-02 15:04:05"
      lat_field: "latitude"
      lon_field: "longitude"
      columns:
        taxi_id:   { from_field: "taxi_id",   type: VARCHAR }
        latitude:  { from_field: "latitude",  type: DOUBLE, required: true }
        longitude: { from_field: "longitude", type: DOUBLE, required: true }
        timestamp: { from_field: "timestamp", type: VARCHAR }


queries:
  # Static data queries
  - name: hazard_zones_proximity_alerts
    data_source: ais_data_v1
    window_type: tumbling
    window_size: 60
    query: "SELECT v.MMSI AS mmsi, v.Name AS name, v.SOG AS sog, v.NavigationalStatus AS navigationalStatus, v.Timestamp AS timestamp, z.zone_name, z.threshold_nm, ROUND(ST_Distance(ST_Transform(ST_Point(v.Longitude, v.Latitude), 'EPSG:4326', 'EPSG:3857'), ST_Transform(ST_GeomFromText(z.geom_wkt), 'EPSG:4326', 'EPSG:3857')) / 1852.0, 2) AS distance_nm FROM events v CROSS JOIN zones z WHERE v.Latitude IS NOT NULL AND ST_Distance(ST_Transform(ST_Point(v.Longitude, v.Latitude), 'EPSG:4326', 'EPSG:3857'), ST_Transform(ST_GeomFromText(z.geom_wkt), 'EPSG:4326', 'EPSG:3857')) / 1852.0 < z.threshold_nm ORDER BY distance_nm"
    return_type: spatial
    is_alert: true
    alert_format: '{mmsi} ({name}) — {distance_nm} nm from "{zone_name}" (threshold {threshold_nm} nm) | sog={sog} kn | status={navigationalStatus} | ts={timestamp}'

  #---------------------------------------------------
  # Temporal data queries, only object id and timestamp
  #---------------------------------------------------

  - name: report_count_per_object
    data_source: t-drive_data_v1
    window_type: tumbling
    window_size: 60
    return_type: temporal
    query: >
      SELECT taxi_id, COUNT(*) AS report_count
      FROM events
      GROUP BY taxi_id
      ORDER BY report_count DESC
    is_alert: false
    alert_format: ""

  - name: presence_span_per_object
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: temporal
    query: >
      WITH typed AS (SELECT object_id, TRY_CAST(ts AS TIMESTAMP) AS ts FROM events)
      SELECT object_id, MIN(ts) AS first_seen, MAX(ts) AS last_seen,
             EXTRACT(EPOCH FROM (MAX(ts) - MIN(ts))) AS presence_seconds
      FROM typed
      GROUP BY object_id
      ORDER BY presence_seconds DESC
    is_alert: false
    alert_format: ""

  - name: reporting_gap_stats_per_object
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: temporal
    query: >
      WITH typed AS (SELECT object_id, TRY_CAST(ts AS TIMESTAMP) AS ts FROM events),
      gaps AS (
          SELECT object_id,
                 EXTRACT(EPOCH FROM (ts - LAG(ts) OVER (PARTITION BY object_id ORDER BY ts))) AS gap_seconds
          FROM typed
      )
      SELECT object_id, COUNT(gap_seconds) AS gap_count,
             ROUND(AVG(gap_seconds), 1) AS avg_gap_seconds, MAX(gap_seconds) AS max_gap_seconds
      FROM gaps
      WHERE gap_seconds IS NOT NULL
      GROUP BY object_id
      ORDER BY max_gap_seconds DESC
    is_alert: false
    alert_format: ""

  - name: activity_by_time_bucket
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: temporal
    query: >
      WITH typed AS (SELECT object_id, TRY_CAST(ts AS TIMESTAMP) AS ts FROM events)
      SELECT time_bucket(INTERVAL '10 seconds', ts) AS bucket,
             COUNT(DISTINCT object_id) AS active_objects, COUNT(*) AS report_count
      FROM typed
      GROUP BY bucket
      ORDER BY bucket
    is_alert: false
    alert_format: ""

  # Bounding box of all activity this window -- lets a map client
  # auto-fit its viewport instead of using a fixed zoom.
  - name: window_bounding_extent
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatial
    query: >
      SELECT MIN(lat) AS min_lat, MAX(lat) AS max_lat, MIN(lon) AS min_lon, MAX(lon) AS max_lon
      FROM events
      WHERE lat IS NOT NULL
    is_alert: false
    alert_format: ""

  # Density heatmap: report count per coarse grid cell. 0.1 degree bins
  # (~11km) -- adjust ROUND precision to your actual spatial spread.
  - name: position_density_grid
    data_source: generic
    window_type: tumbling
    window_size: 60
    query: >
      SELECT ROUND({lat_field}, 1) AS lat_bin, ROUND({lon_field}, 1) AS lon_bin, COUNT(*) AS report_count
      FROM events
      WHERE {lat_field} IS NOT NULL
      GROUP BY lat_bin, lon_bin
      ORDER BY report_count DESC
    return_type: spatial
    is_alert: false
    alert_format: ""

  # One representative position per object: its average lat/lon across
  # however many times it reported this window.
  - name: per_object_mean_position
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatial
    query: >
      SELECT object_id, ROUND(AVG(lat), 5) AS mean_lat, ROUND(AVG(lon), 5) AS mean_lon,
             COUNT(*) AS report_count
      FROM events
      WHERE lat IS NOT NULL
      GROUP BY object_id
      ORDER BY object_id
    is_alert: false
    alert_format: ""

  # Each object's single nearest other object this window, by haversine
  # distance on their most recent reported position (no spatial extension
  # needed). Symmetric: every object gets its own nearest-neighbor row.
  - name: nearest_object_pairs
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatial
    query: >
      WITH latest_position AS (
          SELECT object_id, lat, lon,
                 ROW_NUMBER() OVER (PARTITION BY object_id ORDER BY ts DESC) AS rn
          FROM events
          WHERE lat IS NOT NULL
      ),
      distances AS (
          SELECT a.object_id, b.object_id AS nearest_object_id,
                 ROUND(6371000 * 2 * ASIN(SQRT(
                     POWER(SIN(RADIANS(b.lat - a.lat) / 2), 2) +
                     COS(RADIANS(a.lat)) * COS(RADIANS(b.lat)) * POWER(SIN(RADIANS(b.lon - a.lon) / 2), 2)
                 )), 1) AS distance_m
          FROM latest_position a
          JOIN latest_position b ON a.object_id != b.object_id AND a.rn = 1 AND b.rn = 1
      )
      SELECT object_id, nearest_object_id, distance_m
      FROM distances
      QUALIFY ROW_NUMBER() OVER (PARTITION BY object_id ORDER BY distance_m) = 1
      ORDER BY distance_m
    is_alert: false
    alert_format: ""

  # =====================================================================
  # SPATIO-TEMPORAL -- object_id, lat, lon, ts together, ordered per object
  # =====================================================================

  # Raw ordered path per object across the window.
  - name: ordered_trajectory_points
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatio_temporal
    query: >
      SELECT object_id, lat, lon, ts
      FROM events
      WHERE lat IS NOT NULL
      ORDER BY object_id, ts
    is_alert: false
    alert_format: ""

  # Distance and time gap between each consecutive pair of reports per
  # object -- the building block for speed/anomaly queries when there's
  # no `speed` field to read directly. 
  - name: consecutive_step_distance
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatio_temporal
    query: >
      WITH typed AS (SELECT object_id, lat, lon, TRY_CAST(ts AS TIMESTAMP) AS ts FROM events WHERE lat IS NOT NULL),
      steps AS (
          SELECT object_id, ts, lat, lon,
                 LAG(lat) OVER w AS prev_lat, LAG(lon) OVER w AS prev_lon, LAG(ts) OVER w AS prev_ts
          FROM typed
          WINDOW w AS (PARTITION BY object_id ORDER BY ts)
      )
      SELECT object_id, prev_ts, ts, EXTRACT(EPOCH FROM (ts - prev_ts)) AS step_seconds,
             ROUND(6371000 * 2 * ASIN(SQRT(
                 POWER(SIN(RADIANS(lat - prev_lat) / 2), 2) +
                 COS(RADIANS(prev_lat)) * COS(RADIANS(lat)) * POWER(SIN(RADIANS(lon - prev_lon) / 2), 2)
             )), 1) AS step_distance_m
      FROM steps
      WHERE prev_ts IS NOT NULL
      ORDER BY object_id, ts
    is_alert: false
    alert_format: ""

  # Total ground distance covered per object this window (sum of
  # consecutive-step distances). Needs TRY_CAST -- see caveat above.
  - name: total_distance_traveled
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatio_temporal
    query: >
      WITH typed AS (SELECT object_id, lat, lon, TRY_CAST(ts AS TIMESTAMP) AS ts FROM events WHERE lat IS NOT NULL),
      steps AS (
          SELECT object_id, lat, lon, LAG(lat) OVER w AS prev_lat, LAG(lon) OVER w AS prev_lon
          FROM typed
          WINDOW w AS (PARTITION BY object_id ORDER BY ts)
      ),
      step_distances AS (
          SELECT object_id, 6371000 * 2 * ASIN(SQRT(
                     POWER(SIN(RADIANS(lat - prev_lat) / 2), 2) +
                     COS(RADIANS(prev_lat)) * COS(RADIANS(lat)) * POWER(SIN(RADIANS(lon - prev_lon) / 2), 2)
                 )) AS step_distance_m
          FROM steps
          WHERE prev_lat IS NOT NULL
      )
      SELECT object_id, ROUND(SUM(step_distance_m), 1) AS total_distance_m, COUNT(*) AS num_steps
      FROM step_distances
      GROUP BY object_id
      ORDER BY total_distance_m DESC
    is_alert: false
    alert_format: ""

  # Largest single jump per object, with implied speed -- a huge implied
  # speed over a short time gap is a likely GPS glitch rather than real
  # movement. 
  - name: largest_position_jump
    data_source: generic
    window_type: tumbling
    window_size: 60
    return_type: spatio_temporal
    query: >
      WITH typed AS (SELECT object_id, lat, lon, TRY_CAST(ts AS TIMESTAMP) AS ts FROM events WHERE lat IS NOT NULL),
      steps AS (
          SELECT object_id, ts, lat, lon,
                 LAG(lat) OVER w AS prev_lat, LAG(lon) OVER w AS prev_lon, LAG(ts) OVER w AS prev_ts
          FROM typed
          WINDOW w AS (PARTITION BY object_id ORDER BY ts)
      ),
      step_distances AS (
          SELECT object_id, prev_ts, ts, EXTRACT(EPOCH FROM (ts - prev_ts)) AS step_seconds,
                 6371000 * 2 * ASIN(SQRT(
                     POWER(SIN(RADIANS(lat - prev_lat) / 2), 2) +
                     COS(RADIANS(prev_lat)) * COS(RADIANS(lat)) * POWER(SIN(RADIANS(lon - prev_lon) / 2), 2)
                 )) AS step_distance_m
          FROM steps
          WHERE prev_lat IS NOT NULL
      )
      SELECT object_id, prev_ts AS jump_start, ts AS jump_end, step_seconds,
             ROUND(step_distance_m, 1) AS jump_distance_m,
             ROUND(step_distance_m / NULLIF(step_seconds, 0), 1) AS implied_speed_mps
      FROM step_distances
      QUALIFY ROW_NUMBER() OVER (PARTITION BY object_id ORDER BY step_distance_m DESC) = 1
      ORDER BY jump_distance_m DESC
    is_alert: false
    alert_format: ""
# logic behind return_types. Right now, we could be returning aggregates (summarizing multiple data points into one numerical output) or spatial (coordinates that can get plotted on a graph)
